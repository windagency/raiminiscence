# Read by gitleaks in .husky/pre-commit and ci.yml's gitleaks job: the default rules, plus the
# allowlist below. Allowlist a path only for content that can't carry an inline `gitleaks:allow`.
[extend]
useDefault = true

# LongMemEval retrieval output: chat text from the public LongMemEval dataset, where phrases such as
# "password, points/rewards" trip generic-api-key. Generated by benchmarks/, never hand-written.
[[allowlists]]
description = "LongMemEval benchmark retrieval output"
paths = ['''^benchmarks/longmemeval/(archive/[^/]+/)?[^/]+-results/[^/]+\.jsonl$''']
