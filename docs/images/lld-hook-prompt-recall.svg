<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 976 718" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>UserPromptSubmit hook sequence: the shim resolves the storage root and calls prompt-recall.ts, which runs engine.recall() directly with triggerConsolidation false; results become summary lines, a timeout or error becomes an empty string</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">Per-turn recall gets 2 seconds and never triggers Consolidation</text>

  <line x1="105" y1="96" x2="105" y2="684" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="150" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="105" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Claude Code /Codex</text>
  <text x="105" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">CLI</text>
  <line x1="307" y1="96" x2="307" y2="684" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="204" y="48" width="206" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="307" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">shim.ts</text>
  <text x="307" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">(raiminiscence-hooks-shim)</text>
  <line x1="502" y1="96" x2="502" y2="684" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="434" y="48" width="136" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="502" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">prompt-recall.ts</text>
  <line x1="692" y1="96" x2="692" y2="684" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="628" y="48" width="129" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="692" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">project-root.ts</text>
  <line x1="882" y1="96" x2="882" y2="684" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="818" y="48" width="129" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="882" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">engine.recall()</text>

  <rect x="12" y="386" width="952" height="210" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="206" y="122" font-size="11" fill="var(--text-secondary)" text-anchor="middle">spawns process, pipes hook JSON on stdin</text>
  <text x="206" y="136" font-size="11" fill="var(--text-secondary)" text-anchor="middle">({ cwd, hook_event_name: &quot;UserPromptSubmit&quot;,</text>
  <text x="206" y="150" font-size="11" fill="var(--text-secondary)" text-anchor="middle">prompt })</text>
  <line x1="105" y1="160" x2="304" y2="160" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M307,186 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="349" y="197" font-size="11" fill="var(--text-secondary)">parseHookInput(stdin) → { cwd, hook_event_name,</text>
  <text x="349" y="211" font-size="11" fill="var(--text-secondary)">prompt }</text>
  <text x="500" y="236" font-size="11" fill="var(--text-secondary)" text-anchor="middle">resolveStorageRoot(cwd)</text>
  <line x1="307" y1="246" x2="689" y2="246" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="272" font-size="11" fill="var(--text-secondary)" text-anchor="middle">promptRecallText({ storageRoot, prompt })</text>
  <line x1="307" y1="282" x2="499" y2="282" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="692" y="308" font-size="11" fill="var(--text-secondary)" text-anchor="middle">recall({ storageRoot, query: prompt, triggerConsolidation:</text>
  <text x="692" y="322" font-size="11" fill="var(--text-secondary)" text-anchor="middle">false })</text>
  <text x="692" y="336" font-size="11" fill="var(--text-secondary)" text-anchor="middle">— direct call, no MCP;</text>
  <text x="692" y="350" font-size="11" fill="var(--text-secondary)" text-anchor="middle">k: 10 (ADR-0034); minScore, provider default</text>
  <line x1="502" y1="360" x2="879" y2="360" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="692" y="420" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ results }</text>
  <line x1="882" y1="430" x2="505" y2="430" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="404" y="456" font-size="11" fill="var(--text-secondary)" text-anchor="middle">&quot;[kind, confidence] summary&quot; lines, joined by</text>
  <text x="404" y="470" font-size="11" fill="var(--text-secondary)" text-anchor="middle">&quot;\n&quot;</text>
  <text x="404" y="484" font-size="11" fill="var(--text-secondary)" text-anchor="middle">(surfacedVia/conflictsWith/conflictCandidateWith</text>
  <text x="404" y="498" font-size="11" fill="var(--text-secondary)" text-anchor="middle">dropped)</text>
  <line x1="502" y1="508" x2="310" y2="508" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="404" y="564" font-size="11" fill="var(--text-secondary)" text-anchor="middle">&quot;&quot; (silently — never throws)</text>
  <line x1="502" y1="574" x2="310" y2="574" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="12" y="386" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="399" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="54" y="399" font-size="11" font-style="italic" fill="var(--text-muted)">[resolves within 2s]</text>
  <line x1="12" y1="534" x2="964" y2="534" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="548" font-size="11" font-style="italic" fill="var(--text-muted)">[times out or throws]</text>
  <text x="206" y="614" font-size="11" fill="var(--text-secondary)" text-anchor="middle">stdout:</text>
  <text x="206" y="628" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{&quot;hookSpecificOutput&quot;:{&quot;additionalContext&quot;:&quot;...&quot;}}</text>
  <text x="206" y="642" font-size="11" fill="var(--text-secondary)" text-anchor="middle">or {}</text>
  <line x1="307" y1="652" x2="108" y2="652" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="706" font-size="11.5" fill="var(--text-muted)">Sequence: Per-turn auto-recall hook flow (v10)</text>
</svg>
