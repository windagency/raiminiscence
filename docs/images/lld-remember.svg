<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1477 694" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>remember sequence: server.ts passes the call to engine.remember(), which redacts secrets, writes the Memory, embeds it and upserts the vector only when the embedding is not null, schedules a deferred consolidate() when the debounce is due, then returns the result to the agent</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">remember returns before Consolidation runs; a null embedding skips the index but still stores the Memory</text>

  <line x1="60" y1="96" x2="60" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="59" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="60" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Agent</text>
  <line x1="250" y1="96" x2="250" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="206" y="48" width="87" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="250" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">server.ts</text>
  <line x1="440" y1="96" x2="440" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="368" y="48" width="143" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="440" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">engine.remember()</text>
  <line x1="630" y1="96" x2="630" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="576" y="48" width="108" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="630" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">redaction.ts</text>
  <line x1="820" y1="96" x2="820" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="772" y="48" width="94" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="820" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">storage.ts</text>
  <line x1="1010" y1="96" x2="1010" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="938" y="48" width="143" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="1010" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">EmbeddingProvider</text>
  <line x1="1200" y1="96" x2="1200" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="1135" y="48" width="129" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="1200" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">packed-index.ts</text>
  <line x1="1390" y1="96" x2="1390" y2="660" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="1332" y="48" width="115" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="1390" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">consolidate()</text>
  <text x="1390" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">(deferred)</text>

  <rect x="12" y="402" width="1453" height="66" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="154" y="122" font-size="11" fill="var(--text-secondary)" text-anchor="middle">remember(content, kind?, confidence?, isError?,</text>
  <text x="154" y="136" font-size="11" fill="var(--text-secondary)" text-anchor="middle">model?, scope?)</text>
  <line x1="60" y1="146" x2="246" y2="146" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="344" y="172" font-size="11" fill="var(--text-secondary)" text-anchor="middle">remember({ ..., client: sessionHandshake.name,</text>
  <text x="344" y="186" font-size="11" fill="var(--text-secondary)" text-anchor="middle">storageRoot })</text>
  <line x1="250" y1="196" x2="436" y2="196" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="222" font-size="11" fill="var(--text-secondary)" text-anchor="middle">redactSecrets(content)</text>
  <line x1="440" y1="232" x2="626" y2="232" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="258" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ content, redacted }</text>
  <line x1="630" y1="268" x2="442" y2="268" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="630" y="294" font-size="11" fill="var(--text-secondary)" text-anchor="middle">writeMemory(effectiveRoot, memory)</text>
  <line x1="440" y1="304" x2="816" y2="304" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="330" font-size="11" fill="var(--text-secondary)" text-anchor="middle">embed(content)</text>
  <line x1="440" y1="340" x2="1006" y2="340" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="366" font-size="11" fill="var(--text-secondary)" text-anchor="middle">vector | null</text>
  <line x1="1010" y1="376" x2="442" y2="376" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="820" y="436" font-size="11" fill="var(--text-secondary)" text-anchor="middle">upsertVector(effectiveRoot, id, vector)</text>
  <line x1="440" y1="446" x2="1196" y2="446" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="12" y="402" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="415" font-size="11" font-weight="700" fill="var(--text-on-fill)">opt</text>
  <text x="54" y="415" font-size="11" font-style="italic" fill="var(--text-muted)">[vector !== null]</text>
  <text x="914" y="486" font-size="11" fill="var(--text-secondary)" text-anchor="middle">triggerOpportunisticConsolidation(): setImmediate(consolidate) when the v19 debounce is due</text>
  <line x1="440" y1="496" x2="1386" y2="496" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="518" width="1070" height="28" rx="6" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="914" y="533" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">non-blocking — scheduled after this call returns</text>
  <text x="344" y="568" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ id, kind, confidence, createdAt, redacted,</text>
  <text x="344" y="582" font-size="11" fill="var(--text-secondary)" text-anchor="middle">embedded, consolidationTriggered }</text>
  <line x1="440" y1="592" x2="252" y2="592" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="154" y="618" font-size="11" fill="var(--text-secondary)" text-anchor="middle">tool result</text>
  <line x1="250" y1="628" x2="62" y2="628" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="682" font-size="11.5" fill="var(--text-muted)">Sequence: remember</text>
</svg>
