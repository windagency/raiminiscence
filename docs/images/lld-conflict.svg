<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 729" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>conflict sequence: engine.conflict() checks both Memories exist and that a supersedes verdict names one of them, records the verdict through conflict-edge.ts, and for supersedes retracts the named Memory through engine.forget()</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">Both ids and the supersedes target are validated before any Conflict Edge is written</text>

  <line x1="60" y1="81" x2="60" y2="695" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="59" height="33" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="60" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Agent</text>
  <line x1="250" y1="81" x2="250" y2="695" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="206" y="48" width="87" height="33" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="250" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">server.ts</text>
  <line x1="440" y1="81" x2="440" y2="695" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="368" y="48" width="143" height="33" rx="10" fill="var(--highlight-fill)" stroke="var(--highlight-stroke)" stroke-width="1.5"/>
  <text x="440" y="69" font-size="12.5" font-weight="700" fill="var(--text-on-fill)" text-anchor="middle">engine.conflict()</text>
  <line x1="630" y1="81" x2="630" y2="695" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="582" y="48" width="94" height="33" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="630" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">storage.ts</text>
  <line x1="820" y1="81" x2="820" y2="695" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="752" y="48" width="136" height="33" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="820" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">conflict-edge.ts</text>
  <line x1="1010" y1="81" x2="1010" y2="695" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="945" y="48" width="129" height="33" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="1010" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">engine.forget()</text>

  <rect x="12" y="483" width="1080" height="102" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="12" y="349" width="1080" height="66" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="12" y="265" width="1080" height="66" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="154" y="107" font-size="11" fill="var(--text-secondary)" text-anchor="middle">conflict(memoryId, otherMemoryId, verdict,</text>
  <text x="154" y="121" font-size="11" fill="var(--text-secondary)" text-anchor="middle">retractedId?, scope?)</text>
  <line x1="60" y1="131" x2="246" y2="131" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="344" y="157" font-size="11" fill="var(--text-secondary)" text-anchor="middle">conflict({ ..., storageRoot })</text>
  <line x1="250" y1="167" x2="436" y2="167" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="193" font-size="11" fill="var(--text-secondary)" text-anchor="middle">assertMemoryExists(effectiveRoot, memoryId)</text>
  <line x1="440" y1="203" x2="626" y2="203" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="229" font-size="11" fill="var(--text-secondary)" text-anchor="middle">assertMemoryExists(effectiveRoot, otherMemoryId)</text>
  <line x1="440" y1="239" x2="626" y2="239" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="344" y="299" font-size="11" fill="var(--text-secondary)" text-anchor="middle">throws -&gt; isError: true</text>
  <line x1="440" y1="309" x2="252" y2="309" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="12" y="265" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="278" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="54" y="278" font-size="11" font-style="italic" fill="var(--text-muted)">[either id unknown]</text>
  <text x="344" y="383" font-size="11" fill="var(--text-secondary)" text-anchor="middle">throws -&gt; isError: true</text>
  <line x1="440" y1="393" x2="252" y2="393" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="12" y="349" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="362" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="54" y="362" font-size="11" font-style="italic" fill="var(--text-muted)">[verdict === &quot;supersedes&quot; and retractedId not in {memoryId, otherMemoryId}]</text>
  <text x="630" y="433" font-size="11" fill="var(--text-secondary)" text-anchor="middle">upsertConflictVerdict(effectiveRoot, memoryId,</text>
  <text x="630" y="447" font-size="11" fill="var(--text-secondary)" text-anchor="middle">otherMemoryId, verdict, writer)</text>
  <line x1="440" y1="457" x2="816" y2="457" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="517" font-size="11" fill="var(--text-secondary)" text-anchor="middle">forget({ id: retractedId, scope, now, storageRoot, globalStorageRoot })</text>
  <line x1="440" y1="527" x2="1006" y2="527" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="553" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ alreadyRetracted }</text>
  <line x1="1010" y1="563" x2="442" y2="563" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="12" y="483" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="496" font-size="11" font-weight="700" fill="var(--text-on-fill)">opt</text>
  <text x="54" y="496" font-size="11" font-style="italic" fill="var(--text-muted)">[verdict === &quot;supersedes&quot;]</text>
  <text x="344" y="603" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ memoryId, otherMemoryId, verdict,</text>
  <text x="344" y="617" font-size="11" fill="var(--text-secondary)" text-anchor="middle">alreadyRetracted? }</text>
  <line x1="440" y1="627" x2="252" y2="627" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="154" y="653" font-size="11" fill="var(--text-secondary)" text-anchor="middle">tool result</text>
  <line x1="250" y1="663" x2="62" y2="663" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="717" font-size="11.5" fill="var(--text-muted)">Sequence: conflict</text>
</svg>
