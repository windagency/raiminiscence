<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1038 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>SessionEnd hook sequence: the shim resolves the storage root and calls runSharedMemorySessionEnd, which waits for any in-flight opportunistic pass and pending push, then runs a full consolidate() with an awaited push for every project; failures are logged and swallowed, and the shim always prints an empty object</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">SessionEnd always runs a full, awaited Consolidation pass, for every project, not only Shared Memory ones</text>

  <line x1="80" y1="96" x2="80" y2="566" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="101" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="80" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Claude Code</text>
  <line x1="270" y1="96" x2="270" y2="566" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="168" y="48" width="206" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="270" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">shim.ts</text>
  <text x="270" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">(raiminiscence-hooks-shim)</text>
  <line x1="462" y1="96" x2="462" y2="566" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="398" y="48" width="129" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="462" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">project-root.ts</text>
  <line x1="652" y1="96" x2="652" y2="566" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="566" y="48" width="171" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="652" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">shared-memory-sync.ts</text>
  <line x1="842" y1="96" x2="842" y2="566" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="781" y="48" width="122" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="842" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">consolidate.ts</text>

  <rect x="12" y="432" width="909" height="74" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="176" y="122" font-size="11" fill="var(--text-secondary)" text-anchor="middle">spawns process, pipes hook JSON on stdin</text>
  <text x="176" y="136" font-size="11" fill="var(--text-secondary)" text-anchor="middle">({ cwd, hook_event_name: &quot;SessionEnd&quot; })</text>
  <line x1="80" y1="146" x2="268" y2="146" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="366" y="172" font-size="11" fill="var(--text-secondary)" text-anchor="middle">resolveStorageRoot(cwd)</text>
  <line x1="270" y1="182" x2="459" y2="182" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="461" y="208" font-size="11" fill="var(--text-secondary)" text-anchor="middle">runSharedMemorySessionEnd({ storageRoot })</text>
  <line x1="270" y1="218" x2="649" y2="218" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M652,244 h34 v42 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="255" font-size="11" fill="var(--text-secondary)">settleOpportunisticConsolidation(), then</text>
  <text x="694" y="269" font-size="11" fill="var(--text-secondary)">settlePendingSharedMemoryPush() — wait out anything</text>
  <text x="694" y="283" font-size="11" fill="var(--text-secondary)">this process already started</text>
  <text x="747" y="308" font-size="11" fill="var(--text-secondary)" text-anchor="middle">consolidate({ storageRoot, awaitPush: true }) —</text>
  <text x="747" y="322" font-size="11" fill="var(--text-secondary)" text-anchor="middle">a full pass that bypasses the debounce (v19)</text>
  <line x1="652" y1="332" x2="839" y2="332" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="712" y="354" width="260" height="56" rx="6" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="842" y="369" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">ends with flushSharedMemory(): a no-op</text>
  <text x="842" y="383" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">outside a Shared Memory worktree,</text>
  <text x="842" y="397" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">otherwise commit + an awaited push</text>
  <path d="M652,466 h34 v22 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="477" font-size="11" fill="var(--text-secondary)">logged and swallowed — never throws</text>
  <rect x="12" y="432" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="445" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="54" y="445" font-size="11" font-style="italic" fill="var(--text-muted)">[anything throws]</text>
  <text x="176" y="524" font-size="11" fill="var(--text-secondary)" text-anchor="middle">stdout: {}</text>
  <line x1="270" y1="534" x2="84" y2="534" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="588" font-size="11.5" fill="var(--text-muted)">Sequence: SessionEnd hook flow (v11, reworked in v19)</text>
</svg>
