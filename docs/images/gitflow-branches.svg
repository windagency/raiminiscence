<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Git flow branches: feat-recall-cache merges into int, int merges into main as one squashed change, main is then merged back into int with a merge commit, and hotfix-yaml-dump merges into main and then into int</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">main accepts merges only from int and hotfix-* branches, never from feature branches</text>

  <path d="M160,100 L960,100" fill="none" stroke="var(--box-stroke)" stroke-width="2"/>
  <path d="M200,100 C230,100 230,190 260,190 L960,190" fill="none" stroke="var(--box-stroke)" stroke-width="2"/>
  <path d="M290,190 C320,190 320,280 350,280 L470,280 C500,280 500,190 530,190" fill="none" stroke="var(--box-stroke)" stroke-width="1.5"/>
  <path d="M530,190 C565,190 575,100 610,100" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M610,100 C645,100 655,190 690,190" fill="none" stroke="var(--highlight-stroke)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M740,100 C770,100 770,370 800,370 L840,370" fill="none" stroke="var(--box-stroke)" stroke-width="1.5"/>
  <path d="M840,370 C870,370 880,100 910,100" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <path d="M840,370 C875,370 895,190 930,190" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="104" font-size="12" fill="var(--text-primary)" text-anchor="start">main</text>
  <text x="20" y="194" font-size="12" fill="var(--text-primary)" text-anchor="start">int</text>
  <text x="20" y="284" font-size="12" fill="var(--text-primary)" text-anchor="start">feat-recall-cache</text>
  <text x="20" y="374" font-size="12" fill="var(--text-primary)" text-anchor="start">hotfix-yaml-dump</text>
  <circle cx="180" cy="100" r="6" fill="var(--box-stroke)"/>
  <text x="180" y="86" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">v1.2.0</text>
  <circle cx="380" cy="280" r="6" fill="var(--box-stroke)"/>
  <text x="380" y="266" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">test: failing</text>
  <circle cx="450" cy="280" r="6" fill="var(--box-stroke)"/>
  <text x="450" y="266" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">feat: cache</text>
  <circle cx="530" cy="190" r="6" fill="var(--box-stroke)"/>
  <text x="530" y="176" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">merge feat-recall-cache</text>
  <circle cx="610" cy="100" r="6" fill="var(--box-stroke)"/>
  <text x="610" y="86" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">squash: feat</text>
  <circle cx="690" cy="190" r="6" fill="var(--highlight-stroke)"/>
  <text x="690" y="214" font-size="10.5" fill="var(--text-highlight)" text-anchor="middle">sync main back</text>
  <text x="690" y="228" font-size="10" fill="var(--text-muted)" text-anchor="middle">(merge commit)</text>
  <circle cx="840" cy="370" r="6" fill="var(--box-stroke)"/>
  <text x="840" y="394" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">fix: yaml</text>
  <circle cx="910" cy="100" r="6" fill="var(--box-stroke)"/>
  <text x="910" y="86" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">merge hotfix</text>
  <circle cx="930" cy="190" r="6" fill="var(--box-stroke)"/>
  <text x="930" y="176" font-size="10.5" fill="var(--text-secondary)" text-anchor="middle">merge hotfix</text>

  <text x="20" y="458" font-size="11.5" fill="var(--text-muted)">Git flow: branches and merges</text>
</svg>
