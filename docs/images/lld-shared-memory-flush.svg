<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 686" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Shared Memory flush sequence: sync.ts does nothing outside a Shared Memory worktree; otherwise it stages, commits when anything is staged, pushes, retries with set-upstream when there is no upstream, and swallows a final push failure</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">A push is always attempted, and a failed push leaves local-only memory working</text>

  <line x1="98" y1="96" x2="98" y2="652" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="136" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="98" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">consolidate.ts /</text>
  <text x="98" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">SessionEnd hook</text>
  <line x1="288" y1="96" x2="288" y2="652" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="227" y="48" width="122" height="48" rx="10" fill="var(--highlight-fill)" stroke="var(--highlight-stroke)" stroke-width="1.5"/>
  <text x="288" y="69" font-size="12.5" font-weight="700" fill="var(--text-on-fill)" text-anchor="middle">shared-memory/</text>
  <text x="288" y="84" font-size="12.5" font-weight="700" fill="var(--text-on-fill)" text-anchor="middle">sync.ts</text>
  <line x1="478" y1="96" x2="478" y2="652" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="417" y="48" width="122" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="478" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">git (worktree)</text>

  <rect x="12" y="158" width="545" height="470" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="540" width="529" height="74" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="456" width="529" height="66" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="294" width="529" height="66" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="193" y="122" font-size="11" fill="var(--text-secondary)" text-anchor="middle">flushSharedMemory(storageRoot)</text>
  <line x1="98" y1="132" x2="285" y2="132" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="193" y="192" font-size="11" fill="var(--text-secondary)" text-anchor="middle">no-op</text>
  <line x1="288" y1="202" x2="101" y2="202" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="383" y="258" font-size="11" fill="var(--text-secondary)" text-anchor="middle">add -A</text>
  <line x1="288" y1="268" x2="475" y2="268" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="383" y="328" font-size="11" fill="var(--text-secondary)" text-anchor="middle">commit -m &quot;chore: sync memory&quot;</text>
  <line x1="288" y1="338" x2="475" y2="338" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="294" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="28" y="307" font-size="11" font-weight="700" fill="var(--text-on-fill)">opt</text>
  <text x="62" y="307" font-size="11" font-style="italic" fill="var(--text-muted)">[anything staged]</text>
  <text x="383" y="378" font-size="11" fill="var(--text-secondary)" text-anchor="middle">push (always attempted — a no-op if nothing new,</text>
  <text x="383" y="392" font-size="11" fill="var(--text-secondary)" text-anchor="middle">and this</text>
  <text x="383" y="406" font-size="11" fill="var(--text-secondary)" text-anchor="middle">also pushes setup&#x27;s own earlier unpushed</text>
  <text x="383" y="420" font-size="11" fill="var(--text-secondary)" text-anchor="middle">commits)</text>
  <line x1="288" y1="430" x2="475" y2="430" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="383" y="490" font-size="11" fill="var(--text-secondary)" text-anchor="middle">push --set-upstream origin raiminiscence-memory</text>
  <line x1="288" y1="500" x2="475" y2="500" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="456" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="28" y="469" font-size="11" font-weight="700" fill="var(--text-on-fill)">opt</text>
  <text x="62" y="469" font-size="11" font-style="italic" fill="var(--text-muted)">[push rejected (no upstream yet)]</text>
  <path d="M288,574 h34 v22 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="330" y="585" font-size="11" fill="var(--text-secondary)">swallowed — local-only still works</text>
  <rect x="20" y="540" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="28" y="553" font-size="11" font-weight="700" fill="var(--text-on-fill)">opt</text>
  <text x="62" y="553" font-size="11" font-style="italic" fill="var(--text-muted)">[push still fails (no remote / offline)]</text>
  <rect x="12" y="158" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="171" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="54" y="171" font-size="11" font-style="italic" fill="var(--text-muted)">[not a Shared Memory worktree]</text>
  <line x1="12" y1="228" x2="557" y2="228" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="242" font-size="11" font-style="italic" fill="var(--text-muted)">[otherwise]</text>

  <text x="20" y="674" font-size="11.5" fill="var(--text-muted)">Sequence: Shared Memory (v11)</text>
</svg>
