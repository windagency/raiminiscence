<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1001 850" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Stop hook sequence: checkpoint-nudge.ts reads the session&#x27;s nudge state, counts the turn, and returns nothing for a stop-hook continuation, a client-specific nudge with a state reset when 15 minutes or 20 turns have passed, or nothing with updated state otherwise</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">A hook-triggered continuation is never re-nudged; otherwise 15 minutes or 20 turns trigger a checkpoint nudge</text>

  <line x1="108" y1="126" x2="108" y2="816" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="157" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="108" y="92" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Claude Code /Cursor</text>
  <line x1="314" y1="126" x2="314" y2="816" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="211" y="48" width="206" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="314" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">shim.ts</text>
  <text x="314" y="99" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">(raiminiscence-hooks-shim)</text>
  <line x1="520" y1="126" x2="520" y2="816" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="441" y="48" width="157" height="78" rx="10" fill="var(--highlight-fill)" stroke="var(--highlight-stroke)" stroke-width="1.5"/>
  <text x="520" y="92" font-size="12.5" font-weight="700" fill="var(--text-on-fill)" text-anchor="middle">checkpoint-nudge.ts</text>
  <line x1="710" y1="126" x2="710" y2="816" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="645" y="48" width="129" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="710" y="92" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">project-root.ts</text>
  <line x1="900" y1="126" x2="900" y2="816" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="828" y="48" width="143" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="900" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">.raiminiscence/</text>
  <text x="900" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">hooks-state/</text>
  <text x="900" y="99" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">checkpoint-nudge/</text>
  <text x="900" y="114" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">&lt;sessionId&gt;.json</text>

  <rect x="12" y="416" width="977" height="340" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="211" y="152" font-size="11" fill="var(--text-secondary)" text-anchor="middle">spawns process, pipes hook JSON on stdin</text>
  <text x="211" y="166" font-size="11" fill="var(--text-secondary)" text-anchor="middle">({ cwd, hook_event_name: &quot;Stop&quot;|&quot;stop&quot;,</text>
  <text x="211" y="180" font-size="11" fill="var(--text-secondary)" text-anchor="middle">session_id | conversation_id, stop_hook_active?</text>
  <text x="211" y="194" font-size="11" fill="var(--text-secondary)" text-anchor="middle">})</text>
  <line x1="108" y1="204" x2="311" y2="204" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="512" y="230" font-size="11" fill="var(--text-secondary)" text-anchor="middle">resolveStorageRoot(cwd)</text>
  <line x1="314" y1="240" x2="706" y2="240" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="417" y="266" font-size="11" fill="var(--text-secondary)" text-anchor="middle">checkpointNudge({ storageRoot, sessionId,</text>
  <text x="417" y="280" font-size="11" fill="var(--text-secondary)" text-anchor="middle">client, stopHookActive })</text>
  <line x1="314" y1="290" x2="516" y2="290" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="316" font-size="11" fill="var(--text-secondary)" text-anchor="middle">read(sessionId) → { lastNudgeAt, turnsSinceNudge } |</text>
  <text x="710" y="330" font-size="11" fill="var(--text-secondary)" text-anchor="middle">undefined</text>
  <line x1="520" y1="340" x2="896" y2="340" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520,366 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="562" y="377" font-size="11" fill="var(--text-secondary)">turnsSinceNudge += 1; elapsedMs = now − lastNudgeAt</text>
  <text x="562" y="391" font-size="11" fill="var(--text-secondary)">(0 if no prior record)</text>
  <text x="417" y="450" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{} (never re-nudge a hook-triggered</text>
  <text x="417" y="464" font-size="11" fill="var(--text-secondary)" text-anchor="middle">continuation)</text>
  <line x1="520" y1="474" x2="317" y2="474" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="710" y="530" font-size="11" fill="var(--text-secondary)" text-anchor="middle">write(sessionId, { lastNudgeAt: now, turnsSinceNudge: 0 })</text>
  <text x="710" y="544" font-size="11" fill="var(--text-secondary)" text-anchor="middle">— reset</text>
  <line x1="520" y1="554" x2="896" y2="554" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="417" y="580" font-size="11" fill="var(--text-secondary)" text-anchor="middle">claude-code →</text>
  <text x="417" y="594" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{&quot;decision&quot;:&quot;block&quot;,&quot;reason&quot;:&quot;...&quot;}</text>
  <text x="417" y="608" font-size="11" fill="var(--text-secondary)" text-anchor="middle">cursor → {&quot;followup_message&quot;:&quot;...&quot;}</text>
  <line x1="520" y1="618" x2="317" y2="618" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="710" y="674" font-size="11" fill="var(--text-secondary)" text-anchor="middle">write(sessionId, { lastNudgeAt (unchanged),</text>
  <text x="710" y="688" font-size="11" fill="var(--text-secondary)" text-anchor="middle">turnsSinceNudge })</text>
  <line x1="520" y1="698" x2="896" y2="698" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="417" y="724" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{}</text>
  <line x1="520" y1="734" x2="317" y2="734" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="12" y="416" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="429" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="54" y="429" font-size="11" font-style="italic" fill="var(--text-muted)">[stopHookActive === true]</text>
  <line x1="12" y1="500" x2="989" y2="500" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="514" font-size="11" font-style="italic" fill="var(--text-muted)">[elapsedMs ≥ 15min OR turnsSinceNudge ≥ 20]</text>
  <line x1="12" y1="644" x2="989" y2="644" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="658" font-size="11" font-style="italic" fill="var(--text-muted)">[not due yet]</text>
  <text x="211" y="774" font-size="11" fill="var(--text-secondary)" text-anchor="middle">stdout: &lt;nudge output&gt; or {}</text>
  <line x1="314" y1="784" x2="112" y2="784" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="838" font-size="11.5" fill="var(--text-muted)">Sequence: Stop hook flow (v13)</text>
</svg>
