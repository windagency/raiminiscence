<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 1038" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Fix Nudge sequence: for Bash PostToolUse and PostToolUseFailure events, fix-nudge.ts matches the command against every watched pattern, records a failure&#x27;s stderr tail, and on a later success of the same pattern clears the record and emits a nudge</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">A Fix Nudge fires only when a watched command succeeds after a recorded failure of the same pattern</text>

  <line x1="80" y1="126" x2="80" y2="1004" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="101" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="80" y="92" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Claude Code</text>
  <line x1="270" y1="126" x2="270" y2="1004" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="168" y="48" width="206" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="270" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">shim.ts</text>
  <text x="270" y="99" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">(raiminiscence-hooks-shim)</text>
  <line x1="460" y1="126" x2="460" y2="1004" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="406" y="48" width="108" height="78" rx="10" fill="var(--highlight-fill)" stroke="var(--highlight-stroke)" stroke-width="1.5"/>
  <text x="460" y="92" font-size="12.5" font-weight="700" fill="var(--text-on-fill)" text-anchor="middle">fix-nudge.ts</text>
  <line x1="650" y1="126" x2="650" y2="1004" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="586" y="48" width="129" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="650" y="92" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">project-root.ts</text>
  <line x1="840" y1="126" x2="840" y2="1004" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="772" y="48" width="136" height="78" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="840" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">.raiminiscence/</text>
  <text x="840" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">hooks-state/</text>
  <text x="840" y="99" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">fix-nudge/</text>
  <text x="840" y="114" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">&lt;sessionId&gt;.json</text>

  <rect x="12" y="526" width="914" height="332" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="20" y="610" width="898" height="234" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="176" y="152" font-size="11" fill="var(--text-secondary)" text-anchor="middle">PostToolUse (Bash succeeded)</text>
  <text x="176" y="166" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ tool_name: &quot;Bash&quot;, tool_input: { command },</text>
  <text x="176" y="180" font-size="11" fill="var(--text-secondary)" text-anchor="middle">tool_response: { stdout, stderr } }</text>
  <line x1="80" y1="190" x2="268" y2="190" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="20" y="212" width="310" height="56" rx="6" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="176" y="227" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">or PostToolUseFailure (Bash failed)</text>
  <text x="176" y="241" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">{ tool_name: &quot;Bash&quot;, tool_input: { command },</text>
  <text x="176" y="255" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">error: &quot;Exit code N\n...&quot;, is_interrupt? }</text>
  <path d="M270,290 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="301" font-size="11" fill="var(--text-secondary)">tool_name !== &quot;Bash&quot;? → {} (no-op)</text>
  <text x="312" y="315" font-size="11" fill="var(--text-secondary)">is_interrupt on a failure? → {} (no-op)</text>
  <text x="460" y="340" font-size="11" fill="var(--text-secondary)" text-anchor="middle">resolveWatchedCommands(cwd)</text>
  <line x1="270" y1="350" x2="648" y2="350" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="366" y="376" font-size="11" fill="var(--text-secondary)" text-anchor="middle">fixNudge({ storageRoot, sessionId,</text>
  <text x="366" y="390" font-size="11" fill="var(--text-secondary)" text-anchor="middle">watchedCommands, command, exitCode, stderr })</text>
  <line x1="270" y1="400" x2="458" y2="400" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M460,426 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="502" y="437" font-size="11" fill="var(--text-secondary)">matchWatchedCommands(command, watchedCommands) —</text>
  <text x="502" y="451" font-size="11" fill="var(--text-secondary)">every pattern matched, independently</text>
  <text x="650" y="476" font-size="11" fill="var(--text-secondary)" text-anchor="middle">read(sessionId) → { [pattern]: { command, stderrTail } } |</text>
  <text x="650" y="490" font-size="11" fill="var(--text-secondary)" text-anchor="middle">undefined</text>
  <line x1="460" y1="500" x2="838" y2="500" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M460,560 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="502" y="571" font-size="11" fill="var(--text-secondary)">fixNudgeTransition(previous, { command, exitCode,</text>
  <text x="502" y="585" font-size="11" fill="var(--text-secondary)">stderr })</text>
  <path d="M460,644 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="502" y="655" font-size="11" fill="var(--text-secondary)">record = { command, stderrTail:</text>
  <text x="502" y="669" font-size="11" fill="var(--text-secondary)">truncateStderrTail(stderr) } — never nudges</text>
  <path d="M460,724 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="502" y="735" font-size="11" fill="var(--text-secondary)">record = undefined; nudge fires —</text>
  <text x="502" y="749" font-size="11" fill="var(--text-secondary)">fixNudgeText(previous, command)</text>
  <path d="M460,804 h34 v22 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="502" y="815" font-size="11" fill="var(--text-secondary)">record = undefined — never nudges</text>
  <rect x="20" y="610" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="28" y="623" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="62" y="623" font-size="11" font-style="italic" fill="var(--text-muted)">[exitCode !== 0 (failure)]</text>
  <line x1="20" y1="694" x2="918" y2="694" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="28" y="708" font-size="11" font-style="italic" fill="var(--text-muted)">[exitCode === 0 (success) and a previous failure existed]</text>
  <line x1="20" y1="774" x2="918" y2="774" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="28" y="788" font-size="11" font-style="italic" fill="var(--text-muted)">[success, no previous failure]</text>
  <rect x="12" y="526" width="41" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="539" font-size="11" font-weight="700" fill="var(--text-on-fill)">loop</text>
  <text x="61" y="539" font-size="11" font-style="italic" fill="var(--text-muted)">[for each matched pattern]</text>
  <text x="650" y="876" font-size="11" fill="var(--text-secondary)" text-anchor="middle">write(sessionId, updated state)</text>
  <line x1="460" y1="886" x2="838" y2="886" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="366" y="912" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{} or</text>
  <text x="366" y="926" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{&quot;hookSpecificOutput&quot;:{&quot;additionalContext&quot;:&quot;...&quot;}}</text>
  <line x1="460" y1="936" x2="274" y2="936" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="176" y="962" font-size="11" fill="var(--text-secondary)" text-anchor="middle">stdout: &lt;nudge output&gt; or {}</text>
  <line x1="270" y1="972" x2="84" y2="972" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="1026" font-size="11.5" fill="var(--text-muted)">Sequence: Fix Nudge &amp; Open Failure (v18)</text>
</svg>
