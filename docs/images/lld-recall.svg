<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1298 806" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>recall sequence: engine.recall() embeds the query, reads cached embeddings and records, scores candidates through query-scoring.ts, keeps the top k, rewrites each result&#x27;s recall fields, patches the cache and schedules opportunistic consolidation</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">recall scores from the cached, active-only records and patches that cache in place instead of rebuilding it</text>

  <line x1="60" y1="96" x2="60" y2="772" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="59" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="60" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Agent</text>
  <line x1="250" y1="96" x2="250" y2="772" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="206" y="48" width="87" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="250" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">server.ts</text>
  <line x1="440" y1="96" x2="440" y2="772" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="375" y="48" width="129" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="440" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">engine.recall()</text>
  <line x1="630" y1="96" x2="630" y2="772" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="558" y="48" width="143" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="630" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">EmbeddingProvider</text>
  <line x1="820" y1="96" x2="820" y2="772" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="755" y="48" width="129" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="820" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">packed-index.ts</text>
  <line x1="1010" y1="96" x2="1010" y2="772" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="962" y="48" width="94" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="1010" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">storage.ts</text>
  <line x1="1200" y1="96" x2="1200" y2="772" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="1132" y="48" width="136" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="1200" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">query-scoring.ts</text>
  <text x="1200" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">(v15)</text>

  <text x="154" y="122" font-size="11" fill="var(--text-secondary)" text-anchor="middle">recall(query, kind?, scope?, k?,</text>
  <text x="154" y="136" font-size="11" fill="var(--text-secondary)" text-anchor="middle">minScore?)</text>
  <line x1="60" y1="146" x2="246" y2="146" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="344" y="172" font-size="11" fill="var(--text-secondary)" text-anchor="middle">recall({ query, kind, scope, k, minScore,</text>
  <text x="344" y="186" font-size="11" fill="var(--text-secondary)" text-anchor="middle">storageRoot })</text>
  <line x1="250" y1="196" x2="436" y2="196" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="222" font-size="11" fill="var(--text-secondary)" text-anchor="middle">embed(query)</text>
  <line x1="440" y1="232" x2="626" y2="232" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="534" y="258" font-size="11" fill="var(--text-secondary)" text-anchor="middle">queryVector | null</text>
  <line x1="630" y1="268" x2="442" y2="268" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="630" y="294" font-size="11" fill="var(--text-secondary)" text-anchor="middle">getCachedEmbeddings(effectiveRoot) (v14)</text>
  <line x1="440" y1="304" x2="816" y2="304" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="724" y="330" font-size="11" fill="var(--text-secondary)" text-anchor="middle">snapshotCachedRecords(effectiveRoot) (v14) — active-only memories, conflicts</text>
  <line x1="440" y1="340" x2="1006" y2="340" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="310" y="362" width="260" height="28" rx="6" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="440" y="377" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">pool = cachedMemories filtered by kind</text>
  <text x="820" y="412" font-size="11" fill="var(--text-secondary)" text-anchor="middle">scoreCandidatesForQuery({ query, queryVector, pool, ... }) — v15, see below</text>
  <line x1="440" y1="422" x2="1196" y2="422" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="820" y="448" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ scored, belowMinScore, candidatesById }</text>
  <line x1="1200" y1="458" x2="442" y2="458" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="310" y="480" width="260" height="42" rx="6" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="440" y="495" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">scored.slice(0, k) — recall&#x27;s own</text>
  <text x="440" y="509" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">concern, not the shared scorer&#x27;s</text>
  <text x="724" y="544" font-size="11" fill="var(--text-secondary)" text-anchor="middle">writeMemory(...) for each result</text>
  <text x="724" y="558" font-size="11" fill="var(--text-secondary)" text-anchor="middle">(reset lastRecalledAt, ++recallCount)</text>
  <line x1="440" y1="568" x2="1006" y2="568" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440,594 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="482" y="605" font-size="11" fill="var(--text-secondary)">appendCachedRecords() (ADR-0036: one log</text>
  <text x="482" y="619" font-size="11" fill="var(--text-secondary)">line, not a fresh rebuild)</text>
  <path d="M440,644 h34 v28 h-30" fill="none" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="482" y="655" font-size="11" fill="var(--text-secondary)">triggerOpportunisticConsolidation() (deferred,</text>
  <text x="482" y="669" font-size="11" fill="var(--text-secondary)">non-blocking, debounced since v19)</text>
  <text x="344" y="694" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ results: [...], usedFallback }</text>
  <line x1="440" y1="704" x2="252" y2="704" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="154" y="730" font-size="11" fill="var(--text-secondary)" text-anchor="middle">tool result</text>
  <line x1="250" y1="740" x2="62" y2="740" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="794" font-size="11.5" fill="var(--text-muted)">Sequence: recall</text>
</svg>
