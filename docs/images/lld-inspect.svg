<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1132 962" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>inspect sequence: id, query and list modes route to inspectMemory, inspectQuery and browseMemories; query mode reuses scoreCandidatesForQuery and reads stale or retracted near-misses uncached, and no mode writes anything</title>
  <style>
    :root {
      /* host-independent: safe against a host page whose true background
         we can't know (e.g. OS dark + an explicitly light-themed editor) */
      --box-stroke: #848484;
      --arrow: #848484;
      --divider: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --text-muted: #8C8C8C;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --highlight-stroke: #5C8FD6;
      --panel-fill: #EFEDE8;
      --text-highlight: #5C6A7D;
      --text-on-fill: #1F1F1D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --highlight-stroke: #4E85DE;
        --panel-fill: #201F1E;
        --text-highlight: #AEB9D6;
        --text-on-fill: #F0EFEC;
      }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/>
    </marker>
  </defs>

  <text x="20" y="28" font-size="14" font-weight="700" fill="var(--text-primary)">inspect shares recall&#x27;s scorer but never calls writeMemory</text>

  <line x1="105" y1="96" x2="105" y2="928" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="30" y="48" width="150" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="105" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">Agent or Developer</text>
  <line x1="295" y1="96" x2="295" y2="928" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="234" y="48" width="122" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="295" y="69" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">server.ts /</text>
  <text x="295" y="84" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">inspect-cli.ts</text>
  <line x1="485" y1="96" x2="485" y2="928" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="438" y="48" width="94" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="485" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">inspect.ts</text>
  <line x1="675" y1="96" x2="675" y2="928" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="607" y="48" width="136" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="675" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">query-scoring.ts</text>
  <line x1="865" y1="96" x2="865" y2="928" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="800" y="48" width="129" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="865" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">recall-cache.ts</text>
  <line x1="1055" y1="96" x2="1055" y2="928" stroke="var(--divider)" stroke-width="1" stroke-dasharray="2 3"/>
  <rect x="1008" y="48" width="94" height="48" rx="10" fill="none" stroke="var(--box-stroke)" stroke-width="1.25"/>
  <text x="1055" y="76" font-size="12.5" font-weight="700" fill="var(--text-primary)" text-anchor="middle">storage.ts</text>

  <rect x="12" y="122" width="1108" height="672" rx="8" fill="none" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="200" y="156" font-size="11" fill="var(--text-secondary)" text-anchor="middle">inspect({ id })</text>
  <line x1="105" y1="166" x2="292" y2="166" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="192" font-size="11" fill="var(--text-secondary)" text-anchor="middle">inspectMemory({ id, storageRoot })</text>
  <line x1="295" y1="202" x2="482" y2="202" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="228" font-size="11" fill="var(--text-secondary)" text-anchor="middle">findMemoryById(effectiveRoot, id)</text>
  <line x1="485" y1="238" x2="1052" y2="238" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="264" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ strength, effectiveHalfLifeDays,</text>
  <text x="390" y="278" font-size="11" fill="var(--text-secondary)" text-anchor="middle">reinforcementCeiling, ... }</text>
  <line x1="485" y1="288" x2="298" y2="288" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="200" y="344" font-size="11" fill="var(--text-secondary)" text-anchor="middle">inspect({ query, verbosity? })</text>
  <line x1="105" y1="354" x2="292" y2="354" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="380" font-size="11" fill="var(--text-secondary)" text-anchor="middle">inspectQuery({ query, storageRoot, ... })</text>
  <line x1="295" y1="390" x2="482" y2="390" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="675" y="416" font-size="11" fill="var(--text-secondary)" text-anchor="middle">getCachedEmbeddings()/getCachedRecords() (v14,</text>
  <text x="675" y="430" font-size="11" fill="var(--text-secondary)" text-anchor="middle">active-only)</text>
  <line x1="485" y1="440" x2="862" y2="440" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="466" font-size="11" fill="var(--text-secondary)" text-anchor="middle">scoreCandidatesForQuery({ ... }) — same function</text>
  <text x="580" y="480" font-size="11" fill="var(--text-secondary)" text-anchor="middle">recall() calls</text>
  <line x1="485" y1="490" x2="672" y2="490" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="516" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ scored, belowMinScore, candidatesById }</text>
  <line x1="675" y1="526" x2="488" y2="526" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="770" y="552" font-size="11" fill="var(--text-secondary)" text-anchor="middle">readAllMemories(effectiveRoot, kinds) — uncached, for stale/retracted near-misses only</text>
  <line x1="485" y1="562" x2="1052" y2="562" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="588" font-size="11" fill="var(--text-secondary)" text-anchor="middle">{ results, nearMisses, usedFallback }</text>
  <line x1="485" y1="598" x2="298" y2="598" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="200" y="654" font-size="11" fill="var(--text-secondary)" text-anchor="middle">inspect({ list: true, filters, verbosity? })</text>
  <line x1="105" y1="664" x2="292" y2="664" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="690" font-size="11" fill="var(--text-secondary)" text-anchor="middle">browseMemories({ storageRoot, filters })</text>
  <line x1="295" y1="700" x2="482" y2="700" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="726" font-size="11" fill="var(--text-secondary)" text-anchor="middle">readAllMemories(effectiveRoot, kinds) — uncached, all Confidence Tiers</text>
  <line x1="485" y1="736" x2="1052" y2="736" stroke="var(--arrow)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="762" font-size="11" fill="var(--text-secondary)" text-anchor="middle">InspectMemoryResult[]</text>
  <line x1="485" y1="772" x2="298" y2="772" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <rect x="12" y="122" width="34" height="18" rx="4" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="20" y="135" font-size="11" font-weight="700" fill="var(--text-on-fill)">alt</text>
  <text x="54" y="135" font-size="11" font-style="italic" fill="var(--text-muted)">[id mode]</text>
  <line x1="12" y1="314" x2="1120" y2="314" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="328" font-size="11" font-style="italic" fill="var(--text-muted)">[query mode]</text>
  <line x1="12" y1="624" x2="1120" y2="624" stroke="var(--divider)" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="20" y="638" font-size="11" font-style="italic" fill="var(--text-muted)">[list mode]</text>
  <rect x="165" y="808" width="260" height="56" rx="6" fill="var(--panel-fill)" stroke="var(--divider)" stroke-width="1"/>
  <text x="295" y="823" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">never writeMemory or any</text>
  <text x="295" y="837" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">other write — the hard</text>
  <text x="295" y="851" font-size="11" font-style="italic" fill="var(--text-on-fill)" text-anchor="middle">invariant</text>
  <text x="200" y="886" font-size="11" fill="var(--text-secondary)" text-anchor="middle">tool result (MCP) or formatted text (CLI)</text>
  <line x1="295" y1="896" x2="108" y2="896" stroke="var(--arrow)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="20" y="950" font-size="11.5" fill="var(--text-muted)">Sequence: inspect (v15)</text>
</svg>
