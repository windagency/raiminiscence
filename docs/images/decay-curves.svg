<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Strength decay curves for the four Memory Kinds: checkpoint (3-day half-life) and episodic (7-day) drop off fast after the 14-day grace period, decision (21-day) and semantic (30-day) decay much more slowly</title>
  <style>
    :root {
      /* host-independent: each clears 3:1 against both a white and a #0d1117 page */
      --box-stroke: #848484;
      --grid: #A0A0A0;
      --text-primary: #636363;
      --text-secondary: #787878;
      --series-checkpoint: #dc2626;
      --series-episodic: #ea580c;
      --series-decision: #8b5cf6;
      --series-semantic: #16a34a;
      /* theme-dependent: always paired with their own explicit fill */
      --highlight-fill: #EAF1FB;
      --text-highlight: #5C6A7D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --highlight-fill: #131A25;
        --text-highlight: #AEB9D6;
      }
    }
  </style>
<text x="56" y="20" font-size="16" font-weight="600" fill="var(--text-primary)">Strength decay by Memory Kind (no reinforcement)</text>
<text x="56" y="36" font-size="12" fill="var(--text-secondary)">Strength = 0.5 ^ (max(0, days since last touched − 14) / base half-life)</text>
<rect x="56" y="44" width="119.70" height="256" fill="var(--highlight-fill)"/>
<text x="60.00" y="60" font-size="10" fill="var(--text-highlight)" text-anchor="start">14-day grace period</text>
